name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Permissão necessária para o bot do GitHub criar a Release e fazer o Commit
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obter o código
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Decodificar a Keystore de Debug
      run: base64 --decode debug.keystore.base64 > debug.keystore

    - name: Limpar Cache do Gradle e Compilar o APK
      run: |
        gradle wrapper
        chmod +x ./gradlew
        ./gradlew clean assembleDebug

    - name: Renomear o APK com a versão
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/arrebentona-v${{ github.run_number }}.apk

    - name: Criar pasta e separar o APK
      run: |
        mkdir -p apks_gerados
        cp app/build/outputs/apk/debug/arrebentona-v${{ github.run_number }}.apk apks_gerados/

    - name: Salvar (Commit) a pasta com o APK no repositório
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apks_gerados/
        git commit -m "🤖 APK v${{ github.run_number }} gerado automaticamente"
        git push

    - name: Disponibilizar o APK nos Artefatos
      uses: actions/upload-artifact@v4
      with:
        name: arrebentona-v${{ github.run_number }}
        path: app/build/outputs/apk/debug/*.apk

    - name: Criar Release no GitHub com o APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Versão ${{ github.run_number }}
        files: app/build/outputs/apk/debug/*.apk
