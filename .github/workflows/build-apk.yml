name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite compilar manualmente com um botão

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obter o código
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Dar permissão ao Gradle
      run: chmod +x ./gradlew

    - name: Compilar o APK
      run: ./gradlew assembleDebug

    - name: Disponibilizar o APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: meu-app-apk
        path: app/build/outputs/apk/debug/*.apk
